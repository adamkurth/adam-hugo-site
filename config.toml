baseURL      = "https://adammkurth.netlify.app"
theme        = "hugo-apero"
languageCode = "en"
title        = "Adam M. Kurth"
author       = "Adam M. Kurth"
copyright    = "&copy; 2026 Adam M. Kurth"
googleAnalytics = ""
metaDataFormat  = "yaml"
footnoteReturnLinkContents = "&#8617;" # ↩
[pagination]
  pagerSize = 10
preserveTaxonomyNames = true
ignoreFiles = ["\\.Rmd$", "\\.Rmarkdown$", "_cache$", "\\.knit\\.md$", "\\.utf8\\.md$"]
enableEmoji = true

[markup]
  defaultMarkdownHandler = "goldmark"
  [markup.goldmark.renderer]
    unsafe = true  # Enable user to embed HTML snippets in Markdown content.
    hardwraps = false
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 2
    ordered = false
  [markup.highlight]
    # one of: https://xyproto.github.io/splash/docs/
    style = "github"

[params]
  orgName = "Adam M. Kurth"
  orgLocal = ""
  description = "Adam M. Kurth is a Ph.D. student in Biostatistics at Brown University working on causal inference with real-world healthcare data — target trial emulation, inverse probability weighting, and survival analysis."

  mainSections = ["research"]
  navallcaps = true
  # show/hide social icons in site header & footer
  # configure social icons and links below in [[params.social]]
  socialInHeader = true
  socialInFooter = true
  # Default image for social sharing and search engines.
  # Place image file in `static` folder and specify image name here.
  sharing_image = "/img/headshot-web.jpeg"

  # NOTE: Params.theme takes precedence over Params.custom_theme (see
  # assets/scaffold.scss). Leave `theme` commented out so that the custom
  # palette in assets/hex-colors.scss is the one that actually renders.
  # built-ins: earth / forest / grayscale / magma / paper / peach / plum /
  #            poppy / primer / sky / violet / water
  # theme = ""

  # custom palette lives in assets/hex-colors.scss
  # filename must contain "hex" to be treated as hex codes
  custom_theme = "hex-colors"

  # embedded font families; only these ship complete weights:
  #   EB Garamond (400/600 + italics), Atkinson Hyperlegible (400/700 + italics),
  #   Fraunces (full range). Metropolis and Commissioner ship Light only, so
  #   bold text in those faces gets synthesized by the browser.
  # Body is the native system sans (San Francisco / Segoe UI / Roboto): crisp at
  # small sizes, nothing to download, and plain lining numerals — Atkinson
  # Hyperlegible was tried here but its slashed zero makes every GPA and year
  # on the CV read oddly ("3.8Ø/4.ØØ").
  customtextFontFamily    = "system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
  customheadingFontFamily = "'EB Garamond', Georgia, serif"

  # fallbacks if the custom families above are removed
  textFontFamily = "sans-serif"
  headingFontFamily = "serif"

  # Comments are disabled: this is a static professional site with no blog.
  # Set to "utterances", "giscus" or "disqus" to enable, and configure below.
  comments = ""

  # Configuration of math rendering
  [params.math]
    renderer = "katex" # one of "mathjax" / "katex"

  # Social icons appear in the site header and footer, and on the homepage.
  # Icon pack "fab" = brand icons, "fas" = solid, "far" = regular.
  #
  # NOTE: do NOT use icon_pack = "ai" (academicons). The theme imports
  # assets/academicons/academicons.scss but the Academicons font files were
  # never shipped with this site, so "ai" icons render as empty boxes.
  # Google Scholar has no Font Awesome Free glyph, hence graduation-cap.
  [[params.social]]
      icon      = "envelope"
      icon_pack = "fas"
      url       = "mailto:adam_kurth@brown.edu"
  [[params.social]]
      icon      = "github"
      icon_pack = "fab"
      url       = "https://github.com/adamkurth"
  [[params.social]]
      icon      = "linkedin"
      icon_pack = "fab"
      url       = "https://www.linkedin.com/in/adam-kurth"
  [[params.social]]
      icon      = "orcid"
      icon_pack = "fab"
      url       = "https://orcid.org/0009-0001-7810-5713"
  [[params.social]]
      icon      = "graduation-cap"
      icon_pack = "fas"
      url       = "https://scholar.google.com/citations?user=kTkTEwIAAAAJ&hl=en"

[taxonomies]
  category = "categories"
  tag      = "tags"

[menu]
  [[menu.header]]
    name  = "About"
    url   = "/about/"
    weight = 1
  [[menu.header]]
    name  = "Research"
    url   = "/research/"
    weight = 2
  [[menu.header]]
    name  = "CV"
    url   = "/cv/"
    weight = 3
  [[menu.header]]
    name  = "Advocacy"
    url   = "/advocacy/"
    weight = 4
  [[menu.header]]
    name  = "Contact"
    url   = "/contact/"
    weight = 5

# see https://gohugo.io/about/hugo-and-gdpr/
[privacy]
  [privacy.disqus]
    disable = true
  [privacy.googleAnalytics]
    disable = true
    anonymizeIP = true
    respectDoNotTrack = true
  [privacy.instagram]
    disable = true
    simple = true
  [privacy.x]
    disable = true
    enableDNT = true
    simple = true
  [privacy.vimeo]
    disable = true
    enableDNT = true
    simple = true
  [privacy.youtube]
    disable = false
    privacyEnhanced = true
